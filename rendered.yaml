---
# Source: opsboard/templates/namespace.yaml
apiVersion: v1
kind: Namespace

metadata:
  name: opsboard

  labels:
    app.kubernetes.io/name: opsboard
    
    app.kubernetes.io/instance: opsboard
    
    app.kubernetes.io/version: 1.0.0
    
    app.kubernetes.io/managed-by: Helm
    
    helm.sh/chart: opsboard-1.0.0
---
# Source: opsboard/templates/postgres-secret.yaml
apiVersion: v1
kind: Secret

metadata:
  name: opsboard-postgres-secret
  namespace: opsboard

  labels:
    app.kubernetes.io/name: opsboard
    
    app.kubernetes.io/instance: opsboard
    
    app.kubernetes.io/version: 1.0.0
    
    app.kubernetes.io/managed-by: Helm
    
    helm.sh/chart: opsboard-1.0.0

type: Opaque

stringData:

  POSTGRES_DB: "opsboard"

  POSTGRES_USER: "opsboard"

  POSTGRES_PASSWORD: "opsboard"
---
# Source: opsboard/templates/backend-configmap.yaml
apiVersion: v1
kind: ConfigMap

metadata:
  name: opsboard-backend-config

  namespace: opsboard

  labels:
    app.kubernetes.io/name: opsboard
    
    app.kubernetes.io/instance: opsboard
    
    app.kubernetes.io/version: 1.0.0
    
    app.kubernetes.io/managed-by: Helm
    
    helm.sh/chart: opsboard-1.0.0

data:

  APP_NAME: "OpsBoard API"

  APP_VERSION: "1.0.0"

  ENVIRONMENT: "production"

  DEBUG: "false"

  LOG_LEVEL: "INFO"

  API_PREFIX: "/api"

  CORS_ORIGINS: "*"

  POSTGRES_HOST: "opsboard-postgres"

  POSTGRES_PORT: "5432"

  SEED_DATABASE: "true"
---
# Source: opsboard/templates/postgres-init-configmap.yaml
apiVersion: v1
kind: ConfigMap

metadata:
  name: postgres-init-sql

  namespace: opsboard

  labels:
    app.kubernetes.io/name: opsboard
    
    app.kubernetes.io/instance: opsboard
    
    app.kubernetes.io/version: 1.0.0
    
    app.kubernetes.io/managed-by: Helm
    
    helm.sh/chart: opsboard-1.0.0

data:

  init.sql: |

    -- OpsBoard database initialization.
    --
    -- This script runs automatically the first time the postgres container
    -- starts with an empty data directory (docker-entrypoint-initdb.d
    -- convention). Table creation and seed data are handled by the backend's
    -- SQLAlchemy startup routine instead of here, so the schema stays defined
    -- in one place (the ORM models) rather than being duplicated in SQL.
    
    -- Ensure the database uses UTC consistently regardless of host timezone.
    ALTER DATABASE opsboard SET timezone TO 'UTC';
---
# Source: opsboard/templates/postgres-pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim

metadata:

  name: opsboard-postgres-pvc

  namespace: opsboard

  labels:
    app.kubernetes.io/name: opsboard
    
    app.kubernetes.io/instance: opsboard
    
    app.kubernetes.io/version: 1.0.0
    
    app.kubernetes.io/managed-by: Helm
    
    helm.sh/chart: opsboard-1.0.0

spec:

  accessModes:

    - ReadWriteOnce

  storageClassName: gp2

  resources:

    requests:

      storage: 5Gi
---
# Source: opsboard/templates/postgres-service.yaml
apiVersion: v1
kind: Service

metadata:
  name: opsboard-postgres

  namespace: opsboard

  labels:
    app.kubernetes.io/name: opsboard
    
    app.kubernetes.io/instance: opsboard
    
    app.kubernetes.io/version: 1.0.0
    
    app.kubernetes.io/managed-by: Helm
    
    helm.sh/chart: opsboard-1.0.0

spec:

  selector:
    app: opsboard-postgres

  ports:
    - port: 5432
      targetPort: 5432

  type: ClusterIP
---
# Source: opsboard/templates/postgres-deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: opsboard-postgres
  namespace: opsboard

  labels:
    app.kubernetes.io/name: opsboard
    
    app.kubernetes.io/instance: opsboard
    
    app.kubernetes.io/version: 1.0.0
    
    app.kubernetes.io/managed-by: Helm
    
    helm.sh/chart: opsboard-1.0.0

spec:
  replicas: 1

  selector:
    matchLabels:
      app: opsboard-postgres

  template:
    metadata:
      labels:
        app: opsboard-postgres

    spec:
      containers:
        - name: postgres

          image: "postgres:16"

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5432

          envFrom:
            - secretRef:
                name: opsboard-postgres-secret

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql

          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - opsboard

            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - opsboard

            initialDelaySeconds: 20
            periodSeconds: 10

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: opsboard-postgres-pvc

        - name: init-script
          configMap:
            name: postgres-init-sql
