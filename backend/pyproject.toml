[project]
name = "opsboard-api"
version = "1.0.0"
description = "OpsBoard backend API - a lightweight task management service."
requires-python = ">=3.12"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py312"]
