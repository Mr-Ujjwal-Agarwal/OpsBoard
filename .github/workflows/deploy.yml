name: Deploy OpsBoard to Amazon EKS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

  BACKEND_REPOSITORY: opsboard-backend
  FRONTEND_REPOSITORY: opsboard-frontend

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      ########################################################
      # Checkout
      ########################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ########################################################
      # Configure AWS Credentials (OIDC)
      ########################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      ########################################################
      # Login to Amazon ECR
      ########################################################

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      ########################################################
      # Generate Image Tag
      ########################################################

      - name: Generate Image Tag
        id: vars
        shell: bash
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      ########################################################
      # Build Backend
      ########################################################

      - name: Build Backend Image
        run: |
          docker build \
            -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_REPOSITORY:${{ steps.vars.outputs.TAG }} \
            ./backend

      - name: Push Backend Image
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_REPOSITORY:${{ steps.vars.outputs.TAG }}

      ########################################################
      # Build Frontend
      ########################################################

      - name: Build Frontend Image
        run: |
          docker build \
            -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$FRONTEND_REPOSITORY:${{ steps.vars.outputs.TAG }} \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$FRONTEND_REPOSITORY:${{ steps.vars.outputs.TAG }}

      ########################################################
      # Install kubectl
      ########################################################

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      ########################################################
      # Install Helm
      ########################################################

      - name: Install Helm
        uses: azure/setup-helm@v4

      ########################################################
      # Configure kubeconfig
      ########################################################

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      ########################################################
      # Deploy using Helm
      ########################################################

      - name: Deploy to EKS
        run: |
          helm upgrade --install opsboard ./helm/opsboard \
            --namespace opsboard \
            --create-namespace \
            --set images.backend.repository=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_REPOSITORY \
            --set images.backend.tag=${{ steps.vars.outputs.TAG }} \
            --set images.frontend.repository=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$FRONTEND_REPOSITORY \
            --set images.frontend.tag=${{ steps.vars.outputs.TAG }}

      ########################################################
      # Verify Deployment
      ########################################################

      - name: Verify Deployment
        run: |
          kubectl get pods -n opsboard
          kubectl get svc -n opsboard
          kubectl rollout status deployment/opsboard-backend -n opsboard --timeout=180s
          kubectl rollout status deployment/opsboard-frontend -n opsboard --timeout=180s
