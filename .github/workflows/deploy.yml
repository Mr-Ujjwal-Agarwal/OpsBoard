name: Deploy OpsBoard to Amazon EKS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

  BACKEND_REPOSITORY: opsboard-backend
  FRONTEND_REPOSITORY: opsboard-frontend

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Image Tag
        id: vars
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      ########################################################
      # Backend
      ########################################################

      - name: Build Backend Image
        run: |
          docker build \
          -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_REPOSITORY:${{ steps.vars.outputs.TAG }} \
          ./backend

      - name: Push Backend Image
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_REPOSITORY:${{ steps.vars.outputs.TAG }}

      ########################################################
      # Frontend
      ########################################################

      - name: Build Frontend Image
        run: |
          docker build \
          -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$FRONTEND_REPOSITORY:${{ steps.vars.outputs.TAG }} \
          ./frontend

      - name: Push Frontend Image
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$FRONTEND_REPOSITORY:${{ steps.vars.outputs.TAG }}

      ########################################################
      # kubectl
      ########################################################

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      ########################################################
      # Helm
      ########################################################

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      ########################################################
      # Configure kubeconfig
      ########################################################

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      ########################################################
      # Deploy
      ########################################################

     - name: Helm Upgrade
       run: |
         helm upgrade --install opsboard ./helm/opsboard \
         --namespace opsboard \
         --create-namespace \
         --set images.backend.repository=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_REPOSITORY \
         --set images.backend.tag=${{ steps.vars.outputs.TAG }} \
         --set images.frontend.repository=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$FRONTEND_REPOSITORY \
         --set images.frontend.tag=${{ steps.vars.outputs.TAG }}
      ########################################################
      # Verify
      ########################################################

      - name: Verify Deployment
        run: |
          kubectl get pods -n opsboard
          kubectl get svc -n opsboard
