# -----------------------------------------------------------------------------
# Global Configuration
# -----------------------------------------------------------------------------

namespace: opsboard

# -----------------------------------------------------------------------------
# Images
# -----------------------------------------------------------------------------

images:

  backend:
    repository: 572396339705.dkr.ecr.ap-south-1.amazonaws.com/opsboard-backend
    tag: latest
    pullPolicy: Always

  frontend:
    repository: 572396339705.dkr.ecr.ap-south-1.amazonaws.com/opsboard-frontend
    tag: latest
    pullPolicy: Always

  postgres:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# Replica Count
# -----------------------------------------------------------------------------

replicaCount:

  backend: 2

  frontend: 2

# -----------------------------------------------------------------------------
# PostgreSQL
# -----------------------------------------------------------------------------

postgres:

  database: opsboard

  username: opsboard

  password: opsboard

  storage: 5Gi

  storageClass: gp2

# -----------------------------------------------------------------------------
# Backend
# -----------------------------------------------------------------------------

backend:

  port: 8000

  serviceType: ClusterIP

# -----------------------------------------------------------------------------
# Frontend
# -----------------------------------------------------------------------------

frontend:

  port: 80

  serviceType: ClusterIP

# -----------------------------------------------------------------------------
# LoadBalancer
# -----------------------------------------------------------------------------

loadBalancer:

  serviceType: LoadBalancer

  port: 80

  targetPort: 80

# -----------------------------------------------------------------------------
# Resources
# -----------------------------------------------------------------------------

resources:

  backend:

    requests:
      cpu: 100m
      memory: 128Mi

    limits:
      cpu: 500m
      memory: 512Mi

  frontend:

    requests:
      cpu: 100m
      memory: 128Mi

    limits:
      cpu: 500m
      memory: 512Mi

  postgres:

    requests:
      cpu: 250m
      memory: 256Mi

    limits:
      cpu: "1"
      memory: 1Gi
