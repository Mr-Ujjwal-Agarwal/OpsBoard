apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.backend.serviceName }}

  namespace: {{ .Values.namespace }}

  labels:
{{ include "opsboard.labels" . | indent 4 }}

spec:

  type: ClusterIP

  selector:

    app: {{ .Values.backend.serviceName }}

  ports:

  - name: http

    port: {{ .Values.backend.servicePort }}

    targetPort: {{ .Values.backend.containerPort }}

    protocol: TCP
